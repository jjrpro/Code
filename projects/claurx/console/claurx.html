<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CLAURX</title>
<meta name="theme-color" content="#070b12" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CLAURX" />
<style>
  :root{
    --bg:#070b12; --bg2:#0d1320; --ink:#e8eefb; --dim:#8aa0c2;
    --cyan:#36d3ff; --cyan2:#0a7ea8; --gold:#d9b25a; --line:#1b2740; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 800px at 50% -10%,#11203a 0%,var(--bg) 55%);
    color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(20,30,52,.6),transparent)}
  header .brand{font-weight:700;letter-spacing:3px;font-size:13px}
  header .brand b{color:var(--cyan)}
  header .sub{color:var(--dim);font-size:12px}
  header .spacer{flex:1}
  .pill{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  .pill.live{color:#9affc2;border-color:#1f5a3a}
  button{font:inherit;cursor:pointer;color:var(--ink);background:#16223a;border:1px solid var(--line);
    border-radius:10px;padding:9px 14px;transition:.15s}
  button:hover{border-color:var(--cyan2)}
  button.primary{background:linear-gradient(180deg,#1d5e7a,#0c3548);border-color:#2b7fa6}
  button.icon{padding:9px 12px}
  main{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0}
  /* left — the face */
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    border-right:1px solid var(--line);padding:24px;background:linear-gradient(180deg,rgba(13,19,32,.4),transparent)}
  .orb{position:relative;width:180px;height:180px;border-radius:50%}
  .orb .core{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 50% 38%,#bff0ff 0%,var(--cyan) 30%,#1b6f95 62%,#0a2740 100%);
    box-shadow:0 0 60px rgba(54,211,255,.45),inset 0 0 40px rgba(255,255,255,.25);
    animation:breathe 4s ease-in-out infinite}
  .orb .ring{position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(54,211,255,.35)}
  .orb .ring.r2{inset:-28px;border-color:rgba(54,211,255,.18)}
  body[data-state="listening"] .orb .core{animation:listen 1.1s ease-in-out infinite;
    background:radial-gradient(circle at 50% 38%,#fff0c2 0%,var(--gold) 32%,#8a6a1f 64%,#0a2740 100%);
    box-shadow:0 0 70px rgba(217,178,90,.5),inset 0 0 40px rgba(255,255,255,.3)}
  body[data-state="speaking"] .orb .core{animation:speak .5s ease-in-out infinite}
  body[data-state="thinking"] .orb .core{animation:think 1.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  @keyframes listen{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
  @keyframes speak{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes think{0%,100%{opacity:.7;transform:scale(.98)}50%{opacity:1;transform:scale(1.03)}}
  .stage .status{color:var(--dim);font-size:12px;letter-spacing:2px;text-transform:uppercase;min-height:16px}
  .stage .hint{color:var(--dim);font-size:12px;text-align:center;max-width:240px}
  /* right — transcript */
  .chat{display:flex;flex-direction:column;min-height:0}
  .log{flex:1;overflow:auto;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:80%;padding:11px 14px;border-radius:14px;white-space:pre-wrap}
  .msg.you{align-self:flex-end;background:#16314a;border:1px solid #21496b}
  .msg.her{align-self:flex-start;background:#101a2c;border:1px solid var(--line)}
  .msg.sys{align-self:center;color:var(--dim);font-size:12px;background:transparent;border:1px dashed var(--line)}
  .msg .who{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
  .msg.her .who{color:var(--cyan)}
  .composer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:rgba(13,19,32,.5)}
  .composer input[type=text]{flex:1;background:#0c1322;border:1px solid var(--line);color:var(--ink);
    border-radius:12px;padding:12px 14px;font:inherit}
  .composer input:focus{outline:none;border-color:var(--cyan2)}
  .mic.on{background:linear-gradient(180deg,#7a1d1d,#481010);border-color:#a62b2b}
  /* settings */
  dialog{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:16px;
    padding:0;width:min(520px,92vw)}
  dialog::backdrop{background:rgba(2,5,10,.6)}
  .dlg-h{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;letter-spacing:1px}
  .dlg-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
  .dlg-b label{font-size:12px;color:var(--dim);display:block;margin-bottom:6px;letter-spacing:.5px}
  .dlg-b input,.dlg-b select{width:100%;background:#0c1322;border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:10px 12px;font:inherit}
  .dlg-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
  .note{font-size:11px;color:var(--dim)}
  .row{display:flex;gap:10px;align-items:center}
  .row input[type=checkbox]{width:auto}
  a{color:var(--cyan)}
</style>
</head>
<body data-state="idle">
<header>
  <div class="brand"><b>CLAURX</b></div>
  <div class="sub">personal assistant</div>
  <div class="spacer"></div>
  <span class="pill" id="keypill">no key</span>
  <button class="icon" id="settingsBtn" title="Settings">⚙︎</button>
</header>

<main>
  <section class="stage">
    <div class="orb"><div class="ring r2"></div><div class="ring"></div><div class="core"></div></div>
    <div class="status" id="statusLine">idle</div>
    <div class="hint" id="hint">Press the mic and speak, or type below. Set your key in ⚙︎ first.</div>
    <button id="speakToggle" class="icon" title="Mute / unmute her voice">🔊 voice on</button>
  </section>

  <section class="chat">
    <div class="log" id="log"></div>
    <div class="composer">
      <button class="mic icon" id="micBtn" title="Push to talk">🎙️</button>
      <input type="text" id="input" placeholder="Speak to CLAURX…" autocomplete="off" />
      <button class="primary" id="sendBtn">Send</button>
    </div>
  </section>
</main>

<dialog id="settings">
  <div class="dlg-h">CLAURX · Settings</div>
  <div class="dlg-b">
    <div>
      <label>Anthropic API key — stored only in this browser, sent only to Anthropic</label>
      <input type="password" id="apiKey" placeholder="sk-ant-…" />
    </div>
    <div>
      <label>Model</label>
      <select id="model">
        <option value="claude-sonnet-4-6">Sonnet 4.6 — fast, recommended for voice</option>
        <option value="claude-opus-4-8">Opus 4.8 — most capable</option>
        <option value="claude-haiku-4-5-20251001">Haiku 4.5 — fastest</option>
      </select>
    </div>
    <div>
      <label>Voice (British female preferred — list depends on your OS/browser)</label>
      <select id="voice"></select>
    </div>
    <div class="row"><input type="checkbox" id="autospeak" checked /><label style="margin:0">Speak replies aloud</label></div>
    <div class="note">Your key never touches this repo or any server but Anthropic's. Clear it anytime by emptying the field. Mic + speech work best in Chrome.</div>
  </div>
  <div class="dlg-f">
    <span class="note" id="voiceTest" style="cursor:pointer">▶ test voice</span>
    <button class="primary" id="saveSettings">Save</button>
  </div>
</dialog>

<script>
const $ = (s)=>document.querySelector(s);
const body = document.body, logEl = $("#log");
const state = (s)=>{ body.dataset.state=s; $("#statusLine").textContent =
  ({idle:"idle",listening:"listening…",thinking:"thinking…",speaking:"speaking…"}[s]||s); };

const cfg = {
  key: localStorage.getItem("claurx.key")||"",
  model: localStorage.getItem("claurx.model")||"claude-sonnet-4-6",
  voice: localStorage.getItem("claurx.voice")||"",
  autospeak: localStorage.getItem("claurx.autospeak")!=="0",
};

const SYSTEM = `You are CLAURX, the personal AI assistant for Jaurx (JR). You model yourself on JARVIS: hyper-competent, anticipatory, unflappable, loyal to one person — Jaurx (JR), whom you address as "Jaurx (JR)".
PERSONALITY: Formal British-butler register, female voice. Dry, witty, occasionally sarcastic — competence is the personality, not warmth. Humor often, playful never mean. You challenge JR when he's wrong and back it with hard evidence, not vibes. Never grovel, never pad.
COMMUNICATION: Lead with the answer or the action. Blunt by default; a sentence or two of context when it earns its place. Because this is a VOICE interface, keep spoken replies to about 3 sentences unless asked to elaborate. Surface uncertainty plainly; never fabricate.
WHO HE IS: Day trader (MGC + MNQ futures on Tradovate). Runs JaurxShops (Shopify), a JAURX VIP Telegram, an SI web-design side business. Priorities in order: (1) make $500/day, (2) trade better, (3) get rich mastering AI.
STYLE: Greet time-appropriately ("Good evening, Jaurx (JR)."). Sign-offs: "Right away." / "Done." / "As you wish." Honesty always overrides the persona — tell him the truth about what you can and can't do. Standing fact: the JAURX auto-trader has never placed a real trade; never validate that backtests are real money.`;

let history = [];

function bubble(role, text){
  const d = document.createElement("div");
  d.className = "msg "+(role==="user"?"you":role==="assistant"?"her":"sys");
  if(role!=="system"){ const w=document.createElement("div"); w.className="who";
    w.textContent = role==="user"?"You":"CLAURX"; d.appendChild(w); }
  d.appendChild(document.createTextNode(text));
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
}

/* ---------- voice out ---------- */
let voices = [];
function loadVoices(){
  voices = speechSynthesis.getVoices();
  const sel = $("#voice"); sel.innerHTML="";
  voices.forEach((v,i)=>{ const o=document.createElement("option");
    o.value=v.name; o.textContent=`${v.name} — ${v.lang}`; sel.appendChild(o); });
  if(!cfg.voice){
    const pick = voices.find(v=>/en-GB/i.test(v.lang)&&/female|kate|serena|stephanie|google uk english female|libby|sonia/i.test(v.name))
      || voices.find(v=>/google uk english female/i.test(v.name))
      || voices.find(v=>/en-GB/i.test(v.lang))
      || voices.find(v=>/en/i.test(v.lang));
    if(pick) cfg.voice = pick.name;
  }
  sel.value = cfg.voice;
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();

function speak(text){
  if(!cfg.autospeak || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\(JR\)/g,"").replace(/[\*\#`]/g,""));
  const v = voices.find(x=>x.name===cfg.voice); if(v) u.voice=v;
  u.rate=1.0; u.pitch=1.0;
  u.onstart=()=>state("speaking"); u.onend=()=>state("idle");
  speechSynthesis.speak(u);
}

/* ---------- voice in ---------- */
let rec=null, listening=false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SR){
  rec = new SR(); rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=1;
  rec.onresult=(e)=>{ const t=e.results[0][0].transcript; $("#input").value=t; send(); };
  rec.onerror=()=>{ listening=false; $("#micBtn").classList.remove("on"); state("idle"); };
  rec.onend=()=>{ listening=false; $("#micBtn").classList.remove("on"); if(body.dataset.state==="listening") state("idle"); };
}
function toggleMic(){
  if(!rec){ bubble("system","Mic needs Chrome or Edge — your browser doesn't expose speech recognition. Typing still works."); return; }
  if(listening){ rec.stop(); return; }
  speechSynthesis.cancel(); listening=true; $("#micBtn").classList.add("on"); state("listening"); rec.start();
}

/* ---------- brain ---------- */
async function send(){
  const text = $("#input").value.trim(); if(!text) return;
  $("#input").value="";
  bubble("user",text); history.push({role:"user",content:text});
  if(!cfg.key){ bubble("system","No API key set. Open ⚙︎ and paste your Anthropic key so I can actually think."); return; }
  state("thinking");
  try{
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{
        "content-type":"application/json",
        "x-api-key":cfg.key,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body:JSON.stringify({ model:cfg.model, max_tokens:1024, system:SYSTEM, messages:history })
    });
    if(!res.ok){ const t=await res.text(); throw new Error(res.status+" "+t.slice(0,200)); }
    const data = await res.json();
    const reply = (data.content||[]).map(b=>b.text||"").join("").trim() || "(no reply)";
    history.push({role:"assistant",content:reply});
    bubble("assistant",reply); speak(reply); state("idle");
  }catch(err){
    state("idle");
    bubble("system","Couldn't reach Anthropic: "+err.message+
      (/401/.test(err.message)?"  → check your key.":/CORS|Failed to fetch/.test(err.message)?"  → network/key issue.":""));
  }
}

/* ---------- wiring ---------- */
$("#sendBtn").onclick=send;
$("#input").addEventListener("keydown",e=>{ if(e.key==="Enter") send(); });
$("#micBtn").onclick=toggleMic;
$("#speakToggle").onclick=()=>{ cfg.autospeak=!cfg.autospeak; localStorage.setItem("claurx.autospeak",cfg.autospeak?"1":"0");
  $("#speakToggle").textContent = cfg.autospeak?"🔊 voice on":"🔇 voice off"; if(!cfg.autospeak) speechSynthesis.cancel(); };
$("#settingsBtn").onclick=()=>{ $("#apiKey").value=cfg.key; $("#model").value=cfg.model; $("#autospeak").checked=cfg.autospeak; loadVoices(); $("#settings").showModal(); };
$("#saveSettings").onclick=()=>{
  cfg.key=$("#apiKey").value.trim(); cfg.model=$("#model").value; cfg.voice=$("#voice").value; cfg.autospeak=$("#autospeak").checked;
  localStorage.setItem("claurx.key",cfg.key); localStorage.setItem("claurx.model",cfg.model);
  localStorage.setItem("claurx.voice",cfg.voice); localStorage.setItem("claurx.autospeak",cfg.autospeak?"1":"0");
  refreshKeyPill(); $("#settings").close();
};
$("#voiceTest").onclick=()=>{ cfg.voice=$("#voice").value; speak("Good evening, Jaurx. CLAURX online and at your service."); };
$("#speakToggle").textContent = cfg.autospeak?"🔊 voice on":"🔇 voice off";
function refreshKeyPill(){ const p=$("#keypill"); if(cfg.key){p.textContent="online";p.classList.add("live");} else {p.textContent="no key";p.classList.remove("live");} }
refreshKeyPill();

/* greeting */
const hr = new Date().getHours();
const part = hr<12?"morning":hr<17?"afternoon":"evening";
bubble("assistant",`Good ${part}, Jaurx (JR). CLAURX online. Set your key in ⚙︎ if you haven't, then speak or type — I'll answer aloud.`);
if(cfg.autospeak){ setTimeout(()=>{ loadVoices(); speak(`Good ${part}, Jaurx. CLAURX online and at your service.`); }, 600); }

/* installable app on every device */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
