<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thank you — DropVault</title>
<style>
  body { margin:0; background:#0b0c10; color:#f3f4f6; font:16px/1.6 -apple-system,Segoe UI,Roboto,sans-serif; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .box { max-width:480px; padding:40px; text-align:center; }
  h1 { margin:0 0 12px; }
  p { color:#9aa3b2; }
  a.btn { display:inline-block; margin-top:20px; background:#6c8cff; color:#fff; text-decoration:none; padding:13px 24px; border-radius:10px; font-weight:600; }
  .small { font-size:13px; margin-top:18px; }
</style>
</head>
<body>
<div class="box">
  <h1 id="title">Confirming your payment…</h1>
  <p id="msg">Hang tight — this usually takes a few seconds.</p>
  <div id="action"></div>
  <p class="small" id="exp"></p>
</div>
<script>
const code = new URLSearchParams(location.search).get('code');
let tries = 0;
async function poll() {
  if (!code) { document.getElementById('title').textContent = 'Order not found'; return; }
  const r = await fetch('/api/order?code=' + encodeURIComponent(code));
  if (r.status === 200) {
    const d = await r.json();
    document.getElementById('title').textContent = '✅ ' + d.pack_name;
    document.getElementById('msg').textContent = 'Payment confirmed. Your download is ready.';
    document.getElementById('action').innerHTML = '<a class="btn" href="' + d.download_url + '">Download pack</a>';
    document.getElementById('exp').textContent = 'Link valid for ' + d.expires_hours + ' hours. Save the files somewhere safe.';
    return;
  }
  if (++tries < 40) setTimeout(poll, 3000);
  else {
    document.getElementById('title').textContent = 'Still confirming…';
    document.getElementById('msg').textContent = 'Crypto/card confirmation can take a minute. Refresh this page, or email us with your order code: ' + code;
  }
}
poll();
</script>
</body>
</html>
